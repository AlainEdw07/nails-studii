<ion-app>
  <div class="flex flex-col h-dvh bg-[#F0EFEB]">
    <div
      class="bg-[url('/assets/img/background.jpg')] bg-cover bg-center bg-no-repeat shrink-0 transition-[flex] duration-700 ease-[cubic-bezier(0.22,1,0.36,1)]"
      [ngClass]="isHome ? 'flex-1' : 'flex-none'"
    >
      <div class="bg-white/20 backdrop-brightness-60 h-full w-full p-12 pb-0 pt-6 flex items-end">
        <div>
          <app-navbar></app-navbar>
          <p class="text-[84px] tracking-[18px] text-[#F0EFEB] font-bold">NAILS STUDIO</p>
        </div>
      </div>
    </div>
    <div class="relative overflow-hidden transition-all duration-700"
         [ngClass]="isHome ? 'h-0' : 'flex-1'">
      <ion-router-outlet [animation]="curtainUpAnimation"></ion-router-outlet>
    </div>
  </div>
</ion-app>
