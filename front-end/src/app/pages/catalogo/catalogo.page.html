<ion-content [fullscreen]="true">
  <div class="bg-[#F0EFEB] min-h-full p-8">
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-6 justify-items-center">
      <div *ngFor="let img of galeria"
        class="bg-red-300 h-80 w-64 overflow-hidden cursor-pointer hover:scale-105 transition-all duration-300"
        (click)="abrirImg(img)">
        <img [src]="img" class="h-full w-full object-cover" />
      </div>
    </div>
  </div>
</ion-content>
