<div *ngIf="mostrarModal"
  class="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-black/60 transition-opacity duration-300"
  (click)="cancelar()">

  <div
    class="relative w-full max-w-md bg-[#F0EFEB] p-6 sm:p-8  border border-white/40 transform transition-all duration-300 scale-100 animate-fade-in"
    (click)="$event.stopPropagation()">

    <!-- Botón cerrar rápido -->
    <button (click)="cancelar()"
      class="absolute top-4 right-4 text-[#2f4858]/60 hover:text-[#2f4858] transition-colors p-2 rounded-full hover:bg-black/5"
      aria-label="Cerrar modal">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>

    <!-- Estado de éxito -->
    <ng-container *ngIf="exitoMensaje; else formularioPromo">
      <div class="flex flex-col items-center justify-center text-center py-6 space-y-4">
        <div
          class="w-16 h-16 bg-[#2f4858] text-[#F0EFEB] rounded-full flex items-center justify-center text-3xl shadow-lg animate-bounce">
          ✓
        </div>
        <h3 class="text-2xl font-bold text-[#2f4858]">¡Gracias por suscribirte!</h3>
        <p class="text-sm text-[#2f4858]/80 max-w-xs">
          Hemos registrado tu número <strong>{{ telefono }}</strong>. Te enviaremos nuestras mejores promociones.
        </p>
      </div>
    </ng-container>

    <!-- Formulario principal -->
    <ng-template #formularioPromo>
      <div class="flex flex-col items-center text-center space-y-4">

        <!-- Título -->
        <h2 class="text-2xl sm:text-3xl font-bold text-[#2f4858] leading-tight">
          ¡Recibe ofertas especiales en tu teléfono!
        </h2>

        <!-- Descripción -->
        <p class="text-sm text-[#2f4858]/80">
          Ingresa tu número de teléfono para recibir promociones, descuentos y novedades de <strong>Nails
            Studio</strong>.
        </p>

        <!-- Campo Teléfono -->
        <div class="w-full text-left space-y-1.5 pt-2">
          <label for="promo-phone-input" class="block text-xs font-bold text-[#2f4858] uppercase tracking-wider">
            Número de Teléfono / WhatsApp
          </label>
          <div class="relative flex items-center">
            <input id="promo-phone-input" type="tel" [(ngModel)]="telefono" (keyup.enter)="aceptar()"
              [disabled]="cargando"
              placeholder="Ej: +52 55 1234 5678"
              class="w-full pl-4 pr-4 py-3 bg-white text-[#2f4858] placeholder-[#2f4858]/40 border border-[#2f4858]/20 focus:outline-none focus:ring-2 focus:ring-[#2f4858] focus:border-transparent transition-all font-medium text-base shadow-inner disabled:opacity-50" />
          </div>
          <p *ngIf="errorTelefono" class="text-xs text-red-600 font-semibold pt-0.5">
            {{ errorTelefono }}
          </p>
        </div>

        <!-- Checkbox de consentimiento -->
        <div class="w-full text-left space-y-1.5 pt-1">
          <label class="flex items-start gap-2 cursor-pointer">
            <input type="checkbox" [(ngModel)]="whatsappConsent" [disabled]="cargando"
              class="mt-0.5 w-4 h-4 text-[#2f4858] border-[#2f4858]/30 rounded focus:ring-[#2f4858] focus:ring-2 disabled:opacity-50" />
            <span class="text-xs text-[#2f4858]/80 leading-relaxed">
              Acepto recibir promociones y actualizaciones por WhatsApp de <strong>Nails Studio</strong>.
            </span>
          </label>
        </div>

        <!-- Opciones (3 Botones) -->
        <div class="w-full space-y-2.5 pt-4">
          <!-- 1. Aceptar -->
          <button (click)="aceptar()" [disabled]="cargando"
            class="w-full h-12 py-3.5 px-6 bg-[#2f4858] hover:bg-[#20323e] disabled:opacity-50 text-[#F0EFEB] font-bold rounded-2xl transition-all transform active:scale-95 flex items-center justify-center gap-2">
            <span *ngIf="!cargando">Aceptar</span>
            <span *ngIf="cargando">Registrando...</span>
            <svg *ngIf="!cargando" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
            </svg>
          </button>

          <!-- 2. No volver a mostrar -->
          <button (click)="noVolverAMostrar()"
            class="w-full py-2.5 px-4 text-xs text-[#2f4858]/70 hover:text-[#2f4858] underline underline-offset-4 transition-colors font-medium">
            No volver a mostrar
          </button>
        </div>

      </div>
    </ng-template>

  </div>
</div>
